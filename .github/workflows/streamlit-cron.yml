name: Daily stock data update

on:
  schedule:
    # 5:00 PM IST, after the Indian close. The downloader independently
    # excludes any US intraday candle until it is final.
    - cron: "30 11 * * *"
    # 5:00 AM IST catches the completed US session and any corrected candles.
    - cron: "30 23 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-stock-data-update
  cancel-in-progress: false

jobs:
  update-stock-data:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Update candles, snapshots, and alerts
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python daily_update.py

      - name: Commit updated JSON candle data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data
          if git diff --cached --quiet; then
            echo "No JSON candle changes to commit."
          else
            git commit -m "data: refresh daily stock JSON files"
            git pull --rebase
            git push
          fi
