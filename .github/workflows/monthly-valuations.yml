name: Monthly Screener valuation history

on:
  schedule:
    # 7:45 AM IST on the second day of each month.
    - cron: "15 2 2 * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: monthly-screener-valuations
  cancel-in-progress: false

jobs:
  update-valuations:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Collect Screener.in valuations and fundamentals
        run: python monthly_valuation_update.py

      - name: Commit consolidated Screener.in snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data/metadata/monthly_valuations.parquet data/metadata/screener_fundamentals.json
          if git diff --cached --quiet; then
            echo "No monthly valuation changes to commit."
          else
            git commit -m "data: refresh monthly Screener valuation history"
            git pull --rebase
            git push
          fi
